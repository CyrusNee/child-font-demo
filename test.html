<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>测试</title>
</head>
<body>
    <h1>主题测试</h1>
    <select id="test"></select>
    <div id="output"></div>

    <script src="js/vocabulary.js"></script>
    <script>
        console.log('vocabularyDatabase:', vocabularyDatabase);
        console.log('可用主题:', getAvailableThemes());

        const select = document.getElementById('test');
        const themes = getAvailableThemes();

        themes.forEach(theme => {
            const vocabulary = vocabularyDatabase[theme];
            const option = document.createElement('option');
            option.value = theme;
            option.textContent = `${vocabulary.icon} ${theme}`;
            select.appendChild(option);
        });

        document.getElementById('output').innerHTML = `
            <p>找到 ${themes.length} 个主题</p>
            <p>主题列表: ${themes.join(', ')}</p>
        `;
    </script>
</body>
</html>
